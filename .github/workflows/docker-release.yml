name: docker-release

# Builds the root Dockerfile, the Go backend with the web UI embedded, and publishes it to GHCR,
# and to Docker Hub when configured. Pushes to main publish :main and :sha-<short>; a v1.2.3 tag publishes :1.2.3, :1.2
# and :latest. release.yml calls it with the version of each release it makes, which publishes the same tags as a
# v1.2.3 tag. Both build the version in. Pull requests only build. Each is also published with an -apprise suffix
# (:1.2.3-apprise, :latest-apprise, ...), the Dockerfile's apprise target, which adds the apprise command.
#
# Docker Hub is optional. To enable it, set the repository variable DOCKERHUB_IMAGE (such as
# pantheonlab/uptime-kuma) and the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths: &image-paths
      - "server-go/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-release.yml"
  pull_request:
    branches:
      - main
    paths: *image-paths
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The release's version, such as 1.2.3
        type: string
        required: true
permissions: {}

concurrency:
  # A release's build mustn't queue behind, or be replaced by, the build of the push that made it
  group: docker-release-${{ inputs.version || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: default
            suffix: ""
          - target: apprise
            suffix: -apprise
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.PUSH == 'true' && env.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
          flavor: |
            latest=${{ inputs.version != '' && 'true' || 'auto' }}
            suffix=${{ matrix.suffix }},onlatest=true
          labels: |
            org.opencontainers.image.title=uptime-kuma
            org.opencontainers.image.description=Pantheon Lab's Uptime Kuma: Go backend with embedded web UI, and kuma-import

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          # A v1.2.3 tag or a release builds its version in; other builds report package.json's
          build-args: |
            VERSION=${{ env.RELEASE_VERSION || (github.ref_type == 'tag' && steps.meta.outputs.version) || '' }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: mode=max
          sbom: true
