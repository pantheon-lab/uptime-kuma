{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uptime-kuma.secretName" . }}
  labels:
    {{- include "uptime-kuma.labels" (dict "root" . "name" "secrets") | nindent 4 }}
  annotations:
    # Keep the secret on uninstall, so the database password still matches the data volume.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ANALYTICS_API_TOKEN: {{ include "uptime-kuma.secretValue" (dict "root" . "key" "ANALYTICS_API_TOKEN" "value" .Values.analytics.apiToken "length" 64) | quote }}
  {{- if .Values.timescaledb.enabled }}
  POSTGRES_PASSWORD: {{ include "uptime-kuma.secretValue" (dict "root" . "key" "POSTGRES_PASSWORD" "value" .Values.timescaledb.password "length" 40) | quote }}
  {{- else if .Values.externalDatabase.url }}
  DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  {{- else }}
  {{- fail "Set externalDatabase.url or existingSecret when timescaledb.enabled is false" }}
  {{- end }}
  {{- if .Values.grafana.enabled }}
  GRAFANA_DB_PASSWORD: {{ include "uptime-kuma.secretValue" (dict "root" . "key" "GRAFANA_DB_PASSWORD" "value" .Values.grafana.dbPassword "length" 40) | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ include "uptime-kuma.secretValue" (dict "root" . "key" "GRAFANA_ADMIN_PASSWORD" "value" .Values.grafana.adminPassword "length" 24) | quote }}
  {{- end }}
{{- end }}
