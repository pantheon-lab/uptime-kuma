{{- if .Values.otelCollector.enabled }}
{{- $name := include "uptime-kuma.component" (dict "root" . "name" "otel-collector") -}}
{{- $v := .Values.otelCollector -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "uptime-kuma.labels" (dict "root" . "name" "otel-collector") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "uptime-kuma.selectorLabels" (dict "root" . "name" "otel-collector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uptime-kuma.selectorLabels" (dict "root" . "name" "otel-collector") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/otel-collector-config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: otel-collector
          image: {{ include "uptime-kuma.image" $v.image }}
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $v.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "uptime-kuma.labels" (dict "root" . "name" "otel-collector") | nindent 4 }}
spec:
  selector:
    {{- include "uptime-kuma.selectorLabels" (dict "root" . "name" "otel-collector") | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      appProtocol: grpc
{{- end }}
