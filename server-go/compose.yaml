services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kuma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      # For the Node.js backend. Use a port that isn't taken on this machine.
      - "127.0.0.1:${TIMESCALEDB_PORT:-5433}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kuma -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  analytics:
    build: .
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@timescaledb:5432/kuma
      ANALYTICS_API_TOKEN: ${ANALYTICS_API_TOKEN:?set ANALYTICS_API_TOKEN}
      LISTEN_ADDR: 0.0.0.0:3002
    ports:
      - "127.0.0.1:3002:3002"

volumes:
  timescaledb-data:
