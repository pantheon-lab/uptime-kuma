apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: kuma_grafana
    isDefault: true
    jsonData:
      database: kuma
      sslmode: disable
      postgresVersion: 1700
      timescaledb: true
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
